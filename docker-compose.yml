services:
  db:
    image: postgres:16-alpine
    container_name: myn_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myn}
      POSTGRES_DB: ${POSTGRES_DB:-myn_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myn} -d ${POSTGRES_DB:-myn_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    container_name: myn_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myn}:${POSTGRES_PASSWORD:-myn}@db:5432/${POSTGRES_DB:-myn_db}?schema=public
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

volumes:
  pgdata:
